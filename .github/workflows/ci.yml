name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, unit tests, API suite in-process
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --junitxml reports/junit.xml

  http:
    name: API suite over HTTP (make demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            reports/
            docs/images/*.png
            docs/TEST_CATALOGUE.md

  docker:
    name: docker compose (api + tests containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports && chmod 777 reports
      - run: docker compose up --build --exit-code-from tests
      - if: always()
        run: docker compose down -v
