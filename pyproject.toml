[project]
name = "api-test-automation-framework"
version = "1.0.0"
description = "Environment-parameterised API regression framework: pytest + httpx, JWT auth helper, tenant-scoped client, test tiers and Xray result mapping."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
